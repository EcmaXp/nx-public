[project]
name = "nx-syncers"
version = "1"
description = "EcmaXp's nx config syncers"
authors = [{ name = "EcmaXp" }]
requires-python = ">= 3.14"
dependencies = [
    "click>=8.3",
    "cryptography>=50",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "watchdog>=6.0",
]

[dependency-groups]
dev = [
    "reloader-py>=0.18",
]

[project.urls]
Repository = "https://github.com/EcmaXp/nx-public"

[project.scripts]
nx-sync = "nx.syncers.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["nx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
